; Banc moteur A2212 : l'ESP32 reçoit l'impulsion calculée par Simulink et pilote l'ESC.
; Compiler et charger : pio run -t upload   (depuis ce dossier, ESP32 branché, batterie DÉBRANCHÉE)

[env:esp32doit-devkit-v1]
