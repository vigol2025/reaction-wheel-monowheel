; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Par defaut, "pio run" sans -e compile uniquement la version complete (4 roues).
; Pour le test Phase 1 (1 axe, 1 moteur) : pio run -e test_single_axis -t upload -t monitor
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=5 -DARDUINO_ARCH_ESP32 -DARDUINO_BOARD="ESP32-DOIT-DEVKIT-V1"
build_src_filter = +<*> -<test_single_axis.cpp>

[env:test_single_axis]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=5 -DARDUINO_ARCH_ESP32 -DARDUINO_BOARD="ESP32-DOIT-DEVKIT-V1"
build_src_filter = +<*> -<main.cpp>
